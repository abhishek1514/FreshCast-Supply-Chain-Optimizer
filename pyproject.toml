[project]
name = "restaurant-supply-chain-optimizer"
version = "1.0.0"
description = "Warehouse-to-restaurant distribution optimization app"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "pulp>=3.0,<4.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
